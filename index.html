<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق أدواتي المجانية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #1a73e8; }
        p { color: #555; margin-bottom: 30px; }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 280px;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        h3 { margin-top: 0; color: #333; }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover { background-color: #1557b0; }
        .result {
            margin-top: 15px;
            font-weight: bold;
            color: #2e7d32;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>صندوق أدواتي 🚀</h1>
    <p>أدوات سريعة، مجانية، وبدون تسجيل!</p>

    <div class="container">
        
        <!-- الأداة الأولى: حاسبة العمر -->
        <div class="card">
            <h3>حاسبة العمر 🎂</h3>
            <label style="font-size: 14px; text-align: right; display: block;">أدخل تاريخ ميلادك:</label>
            <input type="date" id="dob">
            <button onclick="calculateAge()">احسب عمري</button>
            <div id="ageResult" class="result"></div>
        </div>

        <!-- الأداة الثانية: عداد الكلمات -->
        <div class="card">
            <h3>عداد النصوص 📝</h3>
            <textarea id="textInput" rows="3" placeholder="اكتب أو انسخ النص هنا..." oninput="countText()"></textarea>
            <div id="countResult" class="result" style="color: #1a73e8;">الكلمات: 0 | الحروف: 0</div>
        </div>

        <!-- الأداة الثالثة: مولد كلمات المرور -->
        <div class="card">
            <h3>كلمة مرور قوية 🔒</h3>
            <button onclick="generatePassword()">توليد كلمة مرور جديدة</button>
            <input type="text" id="passResult" readonly placeholder="ستظهر الكلمة هنا" style="text-align: center; font-weight: bold; letter-spacing: 2px;">
        </div>

    </div>

    <script>
        // برمجة حاسبة العمر
        function calculateAge() {
            let dob = document.getElementById('dob').value;
            if(!dob) {
                document.getElementById('ageResult').innerText = 'الرجاء اختيار تاريخ ميلاد!';
                return;
            }
            let birthDate = new Date(dob);
            let today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            let m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; }
            document.getElementById('ageResult').innerText = `عمرك هو: ${age} سنة`;
        }

        // برمجة عداد الكلمات
        function countText() {
            let text = document.getElementById('textInput').value;
            let words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            let chars = text.length;
            document.getElementById('countResult').innerText = `الكلمات: ${words} | الحروف: ${chars}`;
        }

        // برمجة مولد كلمات المرور
        function generatePassword() {
            let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let pass = "";
            for(let i = 0; i < 12; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passResult').value = pass;
        }
    </script>
</body>
</html>
